version: 2

# The Module 5 fixtures: a small, CLEAN sample of the Jaffle Shop data plus a synthetic PII column
# (`customers.customer_email`, always on the reserved example.com domain). Generated by
# scripts/generate_module5_seeds.py.
#
# column_types is load-bearing: money loads as DECIMAL(16,2) and dates as DATE, so the documented
# types match what the models and Unity Catalog actually hold.

seeds:
  - name: customers
    description: One row per customer.
    config:
      column_types:
        customer_id: string
        customer_name: string
        customer_email: string

  - name: products
    description: One row per SKU, with list price in dollars.
    config:
      column_types:
        product_id: string
        product_name: string
        product_type: string
        product_price: decimal(16,2)

  - name: locations
    description: One row per store.
    config:
      column_types:
        location_id: string
        location_name: string
        opened_at: date
        tax_rate: decimal(5,4)

  - name: orders
    description: One row per order. Two orders are legitimately item-less (subtotal 0).
    config:
      column_types:
        order_id: string
        customer_id: string
        location_id: string
        order_date: date
        order_status: string
        subtotal: decimal(16,2)
        tax_paid: decimal(16,2)
        order_total: decimal(16,2)

  - name: order_items
    description: One row per item on an order.
    config:
      column_types:
        order_item_id: string
        order_id: string
        product_id: string
