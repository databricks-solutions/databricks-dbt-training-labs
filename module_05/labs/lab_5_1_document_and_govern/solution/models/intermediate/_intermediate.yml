version: 2

models:
  - name: int_customer_orders
    description: >
      Per-customer order rollup. Ephemeral: dbt inlines it as a CTE into dim_customers, so it appears
      in this DAG but never exists in Unity Catalog.
    columns:
      - name: customer_id
        description: "{{ doc('customer_id') }}"
      - name: count_orders
        description: Number of orders the customer has placed, in any status.
      - name: first_order_date
        description: The date of the customer's first order.
      - name: last_order_date
        description: The date of the customer's most recent order.
      - name: lifetime_spend
        description: Total order value in dollars, excluding cancelled and returned orders.
