config-version: 2

name: "module_03"
version: "1.0.0"
require-dbt-version: ">=1.11.0"

profile: module_03

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["data-tests"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# Silver layer ships as seeds in the global `silver` schema; labs read via source('silver', ...).
# See models/silver/README.md.
seeds:
  module_03:
    +schema: silver

models:
  module_03:
    gold:
      +materialized: table
      int_orders_enriched:
        +materialized: ephemeral
    incremental:
      +materialized: incremental
