version: 2

# The Module 4 fixtures (FEIP-8102). A small, clean sample of the Jaffle Shop data with a catalog of
# KNOWN defects injected on purpose, so every testing lab has deterministic pass/fail cases.
# Generated by scripts/generate_module4_seeds.py; the answer key is the `defect_catalog` seed.
#
# This is the starter "source YAML": it describes the tables but declares NO tests. Adding tests is
# what the labs teach. Everything is referenced with ref() (not source()) on purpose: `dbt build`
# then orders seeds before the models and tests that read them, so one command works from scratch.
#
# column_types is load-bearing: money loads as DECIMAL(16,2) and dates as DATE, so numeric
# comparisons and CHECK constraints behave exactly (a float load would not).

seeds:
  - name: customers
    description: One row per customer. Contains known defects D01 (NULL name) and D02 (duplicated key).
    config:
      column_types:
        customer_id: string
        customer_name: string

  - name: products
    description: One row per SKU, with list price in dollars. Clean.
    config:
      column_types:
        product_id: string
        product_name: string
        product_type: string
        product_price: decimal(16,2)

  - name: locations
    description: One row per store. Clean.
    config:
      column_types:
        location_id: string
        location_name: string
        opened_at: date
        tax_rate: decimal(5,4)

  - name: orders
    description: >
      One row per order. Contains known defects D03 (orphan customer_id), D04 (invalid order_status),
      D05 (negative tax_paid) and D06 (subtotal does not equal the sum of its item prices, x4).
      Two orders are legitimately item-less (subtotal 0): a deliberate edge case, not a defect.
    config:
      column_types:
        order_id: string
        customer_id: string
        location_id: string
        order_date: date
        order_status: string
        subtotal: decimal(16,2)
        tax_paid: decimal(16,2)
        order_total: decimal(16,2)

  - name: order_items
    description: One row per item on an order. Contains known defect D07 (two lines with an unknown SKU).
    config:
      column_types:
        order_item_id: string
        order_id: string
        product_id: string

  - name: defect_catalog
    description: >
      The answer key: one row per injected defective row, with the rule it violates and the kind of
      test that should catch it. Instructors read it; Lab 4.3's "make it pass" step uses the D06 rows.
    config:
      column_types:
        defect_id: string
        table_name: string
        row_key: string
        rule_violated: string
        caught_by: string
